<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>야경</title>
<style>
  html, body { margin: 0; height: 100%; background: #06080f; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---- 조절값 ----
const PX = 2;            // 도트 크기. 클수록 굵은 도트
const LEN = 400;         // 도로 길이
const HY = 8;            // 고가도로 높이
const RW = 12;           // 도로 반폭 (방향당 3차로, 차로 중심은 중심선에서 2, 6, 10)
const STOP = -18;        // 정지선 (차 중심 기준, 교차로 중심이 0)
const E = 16;            // 교차로 가장자리: 회전은 s=-E 에서 시작해서 목적 차로의 s=+E 로 합류
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];  // 진행 방향 h: 0 동(+x), 1 남(+z), 2 서(-x), 3 북(-z). 시계 방향이라 오른쪽은 (h+1)%4
const ZB = -80;          // 길 B(동서 도로)의 z 위치. 큰길은 x=0 남북 도로, 길 A는 z=0 동서 도로
// 한 축의 신호 순서 (선행 좌회전): L 빨강+좌회전 화살표, LY 노랑, R 전체 빨강, G 초록, GY 노랑, R. 큰길(남북, z 축)이 동서(x 축)보다 길다 (간선도로 우선)
const SEQ = {
  x: [['L', 4.5], ['LY', 1.5], ['R', 2], ['G', 7], ['GY', 1.5], ['R', 2]],
  z: [['L', 6], ['LY', 1.5], ['R', 2], ['G', 24], ['GY', 1.5], ['R', 2]],
};
const TX = SEQ.x.reduce((a, [, d]) => a + d, 0), CYCLE = TX + SEQ.z.reduce((a, [, d]) => a + d, 0);  // 신호 한 주기(초): 앞 TX 초는 동서 축, 나머지는 남북 축이 한 바퀴
// 교차로(노드) 2개: 큰길과 길 A, 큰길과 길 B. off 는 신호 시계를 몇 초 앞당길지 (두 교차로를 같은 시각에 맞춤.
// 6초 어긋나게 하면 늦게 켜지는 쪽 방향의 줄이 두 교차로 사이(차로당 약 7대)에 넘쳐서, 다른 교차로 안에 차가 서거나 그 차로로 우회전하는 차가 90초 넘게 못 들어감)
// st 는 매 프레임 신호 상태, done 은 이 교차로에서 마친 좌회전 직진 우회전 횟수와 그중 동서 방향에서 온 직진 횟수 EW (신호등 재질은 아래에서 채움)
const nodes = [{ x: 0, z: 0, off: 0 }, { x: 0, z: ZB, off: 0 }].map(n => ({ ...n, st: {}, done: { L: 0, S: 0, R: 0, EW: 0 } }));

// ---- 화면 준비 ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080f);
scene.fog = new THREE.Fog(0x06080f, 230, 520);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 1200);
camera.position.set(34, 150, 198);
// ponytail: 작게 그리고 CSS로 확대하는 것만으로 도트 느낌을 냄. 디더링이나 색 수 제한이 필요하면 후처리 셰이더 추가
const renderer = new THREE.WebGLRenderer({ antialias: false });
document.body.append(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 32);
controls.maxPolarAngle = 1.25; controls.minDistance = 40; controls.maxDistance = 360;
function resize() {
  renderer.setSize(innerWidth / PX | 0, innerHeight / PX | 0, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---- 도우미 ----
// 조명 계산 없이 색을 그대로 칠하는 재질만 쓴다 (밤 장면이라 빛은 전부 가짜 글로우로 표현)
const basic = (color, opt) => new THREE.MeshBasicMaterial({ color, ...opt });
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter;
  return t;
}
// ponytail: 신호등, 가로등, 램프 같은 소품은 메시를 하나씩 추가함 (차는 이미 한 대당 메시 4개로 합침). 느려지면 소품도 mergeGeometries 로 합치거나 InstancedMesh로 교체
function box(w, h, d, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}
function flat(w, d, mat, x, y, z, ry = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), mat);
  m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m;
}

// ---- 그림 재료 (전부 코드로 그림) ----
const roadTex = canvasTex(32, 96, g => {  // 폭 24 = 6차로: 세로 96 칸 (1 유닛 = 4 칸)
  g.fillStyle = '#171a21'; g.fillRect(0, 0, 32, 96);
  g.fillStyle = '#7d838f'; g.fillRect(0, 1, 32, 1); g.fillRect(0, 94, 32, 1);  // 가장자리 실선
  for (const y of [15, 31, 63, 79]) g.fillRect(0, y, 16, 2);                  // 차로 경계 점선 4줄 (중심선에서 8, 4, 4, 8)
  g.fillStyle = '#a8842a'; g.fillRect(0, 47, 32, 2);                          // 중앙선
});
roadTex.repeat.set(LEN / 8, 1);
const zebraTex = canvasTex(8, 8, g => {
  g.fillStyle = '#171a21'; g.fillRect(0, 0, 8, 8);
  g.fillStyle = '#8d93a0'; g.fillRect(0, 0, 8, 4);
});
zebraTex.repeat.set(1, 12);
const glowTex = canvasTex(32, 32, g => {
  const r = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  r.addColorStop(0, '#fff'); r.addColorStop(1, '#000');
  g.fillStyle = r; g.fillRect(0, 0, 32, 32);
});
// 바닥에 깔아서 빛이 번진 것처럼 보이게 하는 재질
const glow = (color, opacity) => basic(color, {
  map: glowTex, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false,
});

// ---- 땅, 도로, 횡단보도 ----
const road = basic(0xffffff, { map: roadTex, side: THREE.DoubleSide }), zebra = basic(0xffffff, { map: zebraTex });
const asphalt = basic(0x171a21), concrete = basic(0x232732, { side: THREE.DoubleSide });
flat(LEN, 2 * RW, road, 0, .02, 0);                 // 동서 도로
flat(LEN, 2 * RW, road, 0, .02, 0, Math.PI / 2);    // 남북 도로 (큰길)
flat(LEN, 2 * RW, road, 0, .02, ZB);                // 동서 도로 B
for (const n of nodes) {
  flat(2 * RW, 2 * RW, asphalt, n.x, .04, n.z);     // 교차로 한가운데
  for (const s of [-14, 14]) {                      // 횡단보도 (중심에서 14 떨어진 곳, 길이 24)
    flat(3, 2 * RW, zebra, n.x + s, .05, n.z);
    flat(3, 2 * RW, zebra, n.x, .05, n.z + s, Math.PI / 2);
  }
}

// ---- 고가 고속도로 (곡선) ----
// 아래 [x, z] 점들을 부드럽게 잇는 곡선이 고속도로의 중심선. 점을 옮기면 길 모양이 바뀐다
// 곡선은 서에서 동으로 간다. dir=+1 이 동행(남쪽 차선, 강 쪽), dir=-1 이 서행(북쪽 차선, 도심 쪽)
const hw = new THREE.CatmullRomCurve3(
  [[-260, 82], [-160, 64], [-70, 56], [0, 60], [80, 72], [170, 68], [260, 50]]
    .map(([x, z]) => new THREE.Vector3(x, HY, z)), false, 'centripetal');
const HLEN = hw.getLength();
const P = new THREE.Vector3(), T = new THREE.Vector3();  // 곡선 위의 점과 진행 방향을 담는 임시 변수
const hwPts = hw.getSpacedPoints(120);
// 곡선을 따라 띠 모양 면을 만든다. 띠의 양쪽 가장자리를 (중심선에서 옆으로 벗어난 거리, 곡선 점의 높이에 더하는 값)으로 받는다
// keep(점, 접선) 이 false 인 곳은 면을 비운다
function ribbon(curve, offA, dyA, offB, dyB, mat, keep) {
  const N = 200, L = curve.getLength(), pos = [], uv = [], idx = [], ok = [];
  for (let i = 0; i <= N; i++) {
    curve.getPointAt(i / N, P); curve.getTangentAt(i / N, T);
    const k = 1 / Math.hypot(T.x, T.z);  // 경사진 곡선에서도 옆으로 벗어난 거리가 수평으로 맞게
    ok.push(!keep || keep(P, T));
    pos.push(P.x - T.z * k * offA, P.y + dyA, P.z + T.x * k * offA, P.x - T.z * k * offB, P.y + dyB, P.z + T.x * k * offB);
    uv.push(i / N * L / LEN, 0, i / N * L / LEN, 1);
  }
  for (let i = 0; i < N; i++) if (ok[i] && ok[i + 1]) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  scene.add(new THREE.Mesh(g, mat));
}
ribbon(hw, -RW, 0, RW, 0, road);                                   // 노면
ribbon(hw, -RW, -1, RW, -1, concrete);                             // 바닥면
for (const o of [-RW, RW]) ribbon(hw, o, -1, o, .8, concrete, p => Math.abs(p.x) <= 30 || Math.abs(p.x) >= 86);  // 옆면 겸 방호벽 (램프가 붙는 |x| 30~86 은 끊음)
for (let a = 12; a < HLEN; a += 24) {                              // 기둥 (아래 도로 위는 건너뜀)
  hw.getPointAt(a / HLEN, P);
  if (Math.abs(P.x) > RW + 3 && Math.abs(P.z) > RW + 3) box(2, HY - 1, 2, concrete, P.x, (HY - 1) / 2, P.z);
}

// ---- 램프 4개 (고속도로와 큰길의 바깥 차로(k=2)를 잇는 1차로 연결로) ----
// 고속도로 중심선에서 x 좌표가 x 인 곳을 찾아(곡선을 촘촘히 훑음), 옆으로 off(남쪽이 +)만큼 옮기고 높이를 y 로 한 점과 그곳의 호 길이 위치 a
const hwFine = hw.getSpacedPoints(2000);  // 호 길이로 같은 간격. x 가 서에서 동으로 늘어남
function hwAt(x, off, y) {
  const i = hwFine.findIndex(p => p.x >= x), a = (i - 1 + (x - hwFine[i - 1].x) / (hwFine[i].x - hwFine[i - 1].x)) / 2000 * HLEN;
  hw.getPointAt(a / HLEN, P); hw.getTangentAt(a / HLEN, T);
  return { a, pt: new THREE.Vector3(P.x - T.z * off, y, P.z + T.x * off) };
}
const north = (x, o, y = HY) => hwAt(x, -o, y).pt, south = (x, o, y = HY) => hwAt(x, o, y).pt;  // 고속도로 점 [x, 옆거리, 높이]
const gp = (x, z, y) => new THREE.Vector3(x, y, z);                                             // 지상 점 [x, z, 높이]
const ramps = [
  [north(84, 10), north(70, 11), north(56, 14.5), north(44, 17, 6.8), north(32, 19, 5), gp(20, 43.5, 2.6), gp(13, 39, 1), gp(10, 33, .2), gp(10, 26, 0)],         // R1 서행 진출 > 큰길 북행 바깥 차로
  [gp(-10, 20, 0), gp(-10, 27, .2), gp(-13, 33.5, 1), gp(-20, 38.5, 2.6), north(-32, 19, 5), north(-44, 17, 6.8), north(-56, 14.5), north(-70, 11), north(-84, 10)],  // R2 큰길 남행 바깥 차로 > 서행 진입
  [south(-84, 10), south(-70, 11), south(-56, 14.5), south(-44, 17, 6.8), south(-32, 19, 5), gp(-20, 79, 2.6), gp(-13, 84, 1), gp(-10, 91, .2), gp(-10, 98, 0)],     // R3 동행 진출 > 큰길 남행 바깥 차로
  [gp(10, 98, 0), gp(10, 91, .2), gp(13, 86.5, 1), gp(20, 82.5, 2.6), south(32, 19, 5), south(44, 17, 6.8), south(56, 14.5), south(70, 11), south(84, 10)],         // R4 큰길 북행 바깥 차로 > 동행 진입
].map(pts => { const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal'); return { curve, len: curve.getLength(), done: 0 }; });
const hwDist = (x, z) => Math.min(...hwPts.map(p => Math.hypot(p.x - x, p.z - z)));  // 고속도로 중심선까지의 대략적인 거리
for (const r of ramps) {
  ribbon(r.curve, -3, .03, 3, .03, asphalt);   // 상판 (폭 6, 땅과 겹쳐 깜빡이지 않게 살짝 띄움)
  ribbon(r.curve, -3, -1, 3, -1, concrete);    // 바닥면
  for (const o of [-3, 3]) ribbon(r.curve, o, -1, o, .8, concrete, (p, t) => {  // 양쪽 낮은 벽
    const k = 1 / Math.hypot(t.x, t.z), w = hwDist(p.x - t.z * k * o, p.z + t.x * k * o);
    return p.y >= .6 && !(w < 16 && w < hwDist(p.x, p.z));  // 지상 합류부와, 고속도로 쪽을 향한 면 중 중심선에서 16 이내인 곳은 비움 (차가 드나드는 곳)
  });
  for (let a = 14; a < r.len; a += 14) {       // 기둥 (상판이 2보다 높은 곳만. 아래 끝은 y=-4 까지)
    r.curve.getPointAt(a / r.len, P);
    if (P.y > 2) box(1.5, P.y + 3, 1.5, concrete, P.x, (P.y - 5) / 2, P.z);
  }
}
const rampPts = ramps.flatMap(r => r.curve.getSpacedPoints(100));

// ---- 가로등 ----
const bulb = basic(0xffb45e), lampGlow = glow(0xffa040, .35);
function lamp(x, y, z) {
  box(.3, 6, .3, concrete, x, y + 3, z);
  box(1, .4, 1, bulb, x, y + 6, z);
  flat(16, 16, lampGlow, x, y + .06, z);
}
for (let i = -190, k = 0; i <= 190; i += 20, k++) {
  const s = k % 2 ? RW + 1.5 : -(RW + 1.5);
  if (Math.abs(i) > RW) { lamp(i, 0, s); lamp(i, 0, ZB + s); }         // 길 A, 길 B 를 따라
  if (i < 82 && nodes.every(n => Math.abs(i - n.z) > RW) && !rampPts.some(p => p.y > .3 && Math.hypot(p.x - s, p.z - i) < 5.5)) lamp(s, 0, i);  // 큰길을 따라 (교차로 가까이, 램프 자리, 강 위(z 82 부터)는 비움)
}
for (let a = 0; a < HLEN; a += 24) { hw.getPointAt(a / HLEN, P); lamp(P.x, HY, P.z); }  // 고속도로 중앙분리대

// ---- 신호등 (가로형 4색등: 운전자 기준 왼쪽부터 빨강, 노랑, 좌회전 화살표, 초록) ----
// 교차로(노드)마다 진입 방향 하나씩 4개. 렌즈 재질은 노드별로 축(x, z)별 렌즈별로 공유해서 색을 한 번에 바꿈
// ponytail: 화살표 모양은 안 그림 (해상도가 낮아 안 보임). 화살표 렌즈는 초록과 구분되는 청록색으로만 표시
const LENS = [0xff3030, 0xffc13a, 0x30e8d0, 0x35ff7a];  // 렌즈가 켜졌을 때 색
const lampBox = basic(0x12141a);
for (const n of nodes) {
  n.lens = { x: LENS.map(() => basic(0)), z: LENS.map(() => basic(0)) };  // 렌즈 재질 (축별 4개)
  n.glow = { x: glow(0, .45), z: glow(0, .45) };                           // 바닥 번짐 재질 (축별 1개)
  for (let h = 0; h < 4; h++) {
    const [fx, fz] = DIRS[h], [rx, rz] = DIRS[(h + 1) % 4], axis = h % 2 ? 'z' : 'x';
    // 기둥 자리(진입 차로 오른쪽 길가)에 묶음을 놓고, 묶음 안에서 +x 가 진행 방향, +z 가 오른쪽이 되게 돌린다
    const g = new THREE.Group();
    g.position.set(n.x - (E + 1) * fx + (RW + 1.5) * rx, 0, n.z - (E + 1) * fz + (RW + 1.5) * rz); g.rotation.y = -h * Math.PI / 2; scene.add(g);
    box(.4, 8.25, .4, concrete, 0, 4.125, 0, g);   // 기둥
    box(.3, .3, 12.4, concrete, 0, 8.1, -6.1, g);  // 가로 팔: 기둥 꼭대기에서 도로 중심선 쪽(-z)으로 세 차로 위까지
    box(.6, .6, 4.6, lampBox, 0, 7.5, -7.5, g);    // 등기구 (어두운 가로 상자, 가운데 차로 위)
    for (let i = 0; i < 4; i++) box(.8, .8, .8, n.lens[axis][i], 0, 7.5, -7.5 + (i - 1.5) * 1.1, g);  // 렌즈는 상자보다 살짝 커서 위에서도 보임
    flat(12, 12, n.glow[axis], 0, .07, 0, 0, g);   // 바닥의 색 번짐
  }
}

// ---- 배경 (scenery-final.js 의 buildScenery 를 그대로 옮김): 한강, 땅, 호안, 한강공원, 다리, 건물, 가로수 ----
// 밤 장면의 배경 전부: 한강, 한강공원, 마포대교, 건물, 가로수.
// index.html 의 <script type="module"> 안으로 그대로 옮겨 쓴다. 반환값 update(dt, t) 를 매 프레임 부르면 물결이 흐른다.
// 도로 폭에서 나온 숫자는 전부 RW(도로 반폭, ctx 로 받음)로 적었다.
function buildScenery(ctx) {
  const { THREE, scene, basic, glow, canvasTex, mergeGeometries, hw, ZB, RW } = ctx;
  let seed = 20240607;  // 매번 같은 풍경이 나오도록 Math.random 대신 쓰는 난수
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const pick = a => a[rnd() * a.length | 0];
  const RX = 64, RZ = RW + 10;  // 램프 구역: |x| < RX 이고 z > RZ (건물, 나무, 공원 가로등을 두지 않음)
  const RC = RW + 8;            // 교차로와 도로에서 건물, 가로수를 비우는 거리 (도로 중심선 기준)

  // ---- 0. 준비 ----
  // 고속도로 중심선을 400 개 점으로 샘플링한다. (nx, nz) 는 남쪽(+z)을 향한 단위 법선
  const N = 400, S = [];
  for (let i = 0; i <= N; i++) {
    const p = hw.getPointAt(i / N), t = hw.getTangentAt(i / N);
    S.push({ x: p.x, z: p.z, nx: -t.z, nz: t.x });
  }
  const pt = (s, d, y) => [s.x + s.nx * d, y, s.z + s.nz * d];  // 중심선에서 남쪽으로 d 만큼 떨어진 점

  // 강기슭 선 = 중심선 + 남쪽 RW + 14. 양 끝은 x = -700, 700 까지 같은 z 로 곧게 뺀다
  // ponytail: 평행 이동이라 곡률 반경이 RW + 14 보다 작은 급커브가 생기면 선이 꼬인다 (지금 곡선은 완만함)
  const sh = S.map(s => pt(s, RW + 14, 0));
  const shore = [[-700, 0, sh[0][2]], ...sh, [700, 0, sh[N][2]]];
  function shoreZ(x) {  // 강기슭 선의 x 위치에서의 z (선분 사이를 보간)
    for (let i = 1; i < shore.length; i++) {
      const [x0, , z0] = shore[i - 1], [x1, , z1] = shore[i];
      if (x >= x0 && x <= x1) return z0 + (z1 - z0) * (x - x0) / (x1 - x0);
    }
  }

  // 색이 하나뿐인 것(땅, 벽, 상판, 지붕, 간판...)은 꼭짓점 색을 입혀 solid 목록에 모았다가 마지막에 메시 1개로 합친다
  const solid = [];
  function paint(g, hex) {
    g.deleteAttribute('normal'); g.deleteAttribute('uv');  // 합치려면 속성 구성이 같아야 해서 색 외에는 지운다
    const c = new THREE.Color(hex), col = [];
    for (let i = 0; i < g.attributes.position.count; i++) col.push(c.r, c.g, c.b);
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    solid.push(g);
  }
  const put = (w, h, d, x, y, z, hex) => paint(new THREE.BoxGeometry(w, h, d).translate(x, y, z), hex);
  const quad = (w, d, x, y, z, hex) => paint(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2).translate(x, y, z), hex);
  // 점 쌍 (A[i], B[i]) 을 이어 만든 띠. 각 점은 [x, y, z]. 감는 방향을 신경 쓰지 않으려고 재질은 양면으로 그린다
  function ribbon(A, B) {
    const pos = [], idx = [];
    for (let i = 0; i < A.length; i++) {
      pos.push(...A[i], ...B[i]);
      if (i) idx.push(2 * i - 2, 2 * i - 1, 2 * i, 2 * i - 1, 2 * i + 1, 2 * i);
    }
    return new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)).setIndex(idx);
  }
  // 고속도로 중심선에서 남쪽으로 d0 ~ d1 떨어진 띠. 큰길(폭 2 * RW)이 지나는 가운데는 띠 양쪽 가장자리가 모두 |x| > RW + 1 인 구간만 남겨서 뺀다
  function band(d0, d1, y, hex) {
    for (const sign of [-1, 1]) {
      const run = S.filter(s => sign * pt(s, d0, 0)[0] > RW + 1 && sign * pt(s, d1, 0)[0] > RW + 1);
      paint(ribbon(run.map(s => pt(s, d0, y)), run.map(s => pt(s, d1, y))), hex);
    }
  }
  // 바닥에 깔 가산 혼합 글로우 면 (종류별로 모았다가 메시 1개로 합친다)
  const glowQuad = (w, d, x, y, z) => new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2).translate(x, y, z);
  const parkGlow = [], deckGlow = [], reflect = [];

  // ---- 1. 한강, 땅, 호안 ----
  // 물은 두 겹: (가) 어두운 바탕 물결, (나) 그 위(0.02)에 가산 혼합으로 얹는 드문드문한 밝은 잔물결.
  // 둘 다 서쪽(-x)으로 흐르고 (나)가 두 배 빨라서 속도 차이로 흐름이 느껴진다. 무늬 한 장의 크기(유닛)와 속도(유닛/초)
  const TILE1 = 48, TILE2 = 64, V1 = 1.5, V2 = 3;
  function rippleTex(bg, n, len0, len1, cols, thick) {  // 가로로 짧은 선 n 개를 흩뿌린 128 x 128 무늬 (thick 확률로 2칸 두께). 선이 무늬 가장자리를 넘지 않게 해서 이음새가 안 보임
    return canvasTex(128, 128, g => {
      g.fillStyle = bg; g.fillRect(0, 0, 128, 128);
      for (let i = 0; i < n; i++) {
        const len = len0 + rnd() * (len1 - len0) | 0;
        g.fillStyle = pick(cols);
        g.fillRect(rnd() * (128 - len) | 0, rnd() * 128 | 0, len, rnd() < thick ? 2 : 1);
      }
    });
  }
  const waterTex = rippleTex('#08121f', 60, 6, 18, ['#0e1f35', '#122a45', '#17304f'], .3);  // 어두운 남색 바탕, 선은 아주 조금만 밝게
  const glintTex = rippleTex('#000', 6, 6, 16, ['#4a6f9c', '#6f98c8', '#a8c8f0'], 0);      // 검은 바탕(가산이라 안 보임)에 푸른 흰색 선 몇 개
  waterTex.repeat.set(2000 / TILE1, 1000 / TILE1);
  glintTex.repeat.set(2000 / TILE2, 1000 / TILE2);
  const sea = new THREE.PlaneGeometry(2000, 1000).rotateX(-Math.PI / 2);
  const water = new THREE.Mesh(sea, basic(0xffffff, { map: waterTex }));
  water.position.set(0, -4, 300); scene.add(water);
  const glints = new THREE.Mesh(sea, basic(0xffffff, { map: glintTex, transparent: true, opacity: .5, blending: THREE.AdditiveBlending, depthWrite: false }));
  glints.position.set(0, -3.98, 300); scene.add(glints);
  paint(ribbon(shore, shore.map(p => [p[0], 0, -700])), 0x0b0e15);   // 땅: 강기슭 선에서 북쪽 z = -700 까지
  paint(ribbon(shore, shore.map(p => [p[0], -4, p[2]])), 0x232732);  // 호안: 강기슭 선을 따라 선 벽

  // ---- 2. 한강공원 ----
  const GRASS = 0x12261b;
  band(RW + 2, RW + 13, .03, GRASS);        // 잔디 (고속도로 남쪽)
  band(RW + 6, RW + 7.6, .04, 0x3a3f4b);    // 자전거길
  band(-(RW + 9), -(RW + 1), .03, GRASS);   // 잔디 (고속도로 북쪽, 음수 거리 = 북쪽)
  // 램프 구역 안쪽(RW + 1 <= |x| <= RX): z = RZ 선부터 위 북쪽 띠의 북쪽 가장자리까지 잔디로 채운다. 나무는 두지 않음 (램프가 낮게 지나감)
  for (const sign of [-1, 1]) {
    const edge = S.map(s => pt(s, -(RW + 9), .03)).filter(p => sign * p[0] >= RW + 1 && sign * p[0] <= RX);
    paint(ribbon(edge.map(p => [p[0], .03, RZ]), edge), GRASS);
  }
  // 공원 가로등: 자전거길을 따라 약 28 간격. 램프 구역은 건너뜀
  for (let i = 5, step = Math.round(28 * N / hw.getLength()); i <= N; i += step) {
    const [x, , z] = pt(S[i], RW + 6.8, 0);
    if (Math.abs(x) < RX) continue;
    put(.25, 4, .25, x, 2, z, 0x232732);
    put(.6, .4, .6, x, 4.2, z, 0xeaf2ff);
    parkGlow.push(glowQuad(10, 10, x, .06, z));
  }

  // ---- 3. 다리 (마포대교 느낌의 단순한 거더교): 상판, 교각, 난간, 조명 ----
  // ponytail: 상판은 직선 상자 하나. 강기슭을 2 만큼 땅속으로 파고들게 하고 윗면을 y = -0.01 로 해서 땅과 겹쳐 깜빡이는 것을 피함
  const bz = shoreZ(0) - 2, BZ = 230, mid = (bz + BZ) / 2, BL = BZ - bz;
  put(2 * RW + 6, 1.5, BL, 0, -.76, mid, 0x2b303c);          // 상판 (폭 2 * RW + 6 = 차도 2 * RW + 보도 3 x 2)
  quad(2 * RW, BZ - 200, 0, .02, (200 + BZ) / 2, 0x171a21);  // index.html 의 도로가 끝나는 z = 200 부터 다리 끝까지의 노면
  for (let z = bz + 20; z < BZ - 4; z += 36) for (const sx of [-(RW - 3), RW - 3]) put(2.4, 3, 3.6, sx, -3, z, 0x232732);  // 교각 (물 밑까지)
  // 난간과 조명은 강기슭 + 18 부터: 그 앞(z 약 68 ~ 86)은 고속도로 램프가 다리 양옆으로 합류하는 자리라 비워 둔다
  const rz = shoreZ(0) + 18, BX = RW + 2.75;  // BX: 난간과 조명 기둥의 x (상판 가장자리 안쪽)
  for (const sx of [-1, 1]) {
    put(.5, .9, BZ - rz, sx * BX, .45, (rz + BZ) / 2, 0x3a404d);  // 난간
    // 다리 조명: 18 간격, 양쪽을 반 칸씩 엇갈리게. ponytail: 물 위 반사광은 진짜 반사가 아니라 길쭉한 글로우 면
    for (let z = rz + (sx < 0 ? 6 : 15); z < BZ - 3; z += 18) {
      put(.25, 5, .25, sx * BX, 2.5, z, 0x232732);
      put(.8, .5, .8, sx * BX, 5.2, z, 0xffe2b0);
      deckGlow.push(glowQuad(8, 12, sx * (RW + 1.2), .06, z));
      const za = Math.max(z - 13, rz);  // 반사광 면(길이 26)도 난간 시작선 rz 앞으로는 나오지 않게 앞쪽을 자른다
      reflect.push(glowQuad(8, z + 13 - za, sx * (RW + 6), -3.95, (za + z + 13) / 2));
    }
  }

  // ---- 가로수 (InstancedMesh 하나) + 줄기 ----
  const trees = [];  // { x, z, s }: s 는 크기 배율
  const ok = (x, z) => !(Math.abs(x) < RX && z > RZ) && z < shoreZ(x);  // 램프 구역과 강 위는 제외
  for (let t = -192; t <= 192; t += 9) for (const s of [-(RW + 3), RW + 3]) {  // 도로 중심선에서 RW + 3 (보도)
    if (Math.abs(t) > RC && Math.abs(t - ZB) > RC && ok(s, t)) trees.push({ x: s, z: t, s: 1 });  // 큰길 양옆
    if (Math.abs(t) > RC && ok(t, s)) trees.push({ x: t, z: s, s: 1 });                           // 길 A
    if (Math.abs(t) > RC && ok(t, ZB + s)) trees.push({ x: t, z: ZB + s, s: 1 });                 // 길 B
  }
  for (let i = 3; i <= N; i += 7) {  // 공원 나무: 자전거길(RW + 6 ~ RW + 7.6) 양쪽, 드문드문
    const [x, , z] = pt(S[i], rnd() < .5 ? RW + 3.5 + rnd() * 1.5 : RW + 8.5 + rnd() * 2.5, 0);
    if (rnd() < .7 && Math.abs(x) >= RX) trees.push({ x, z, s: 1 + rnd() * .4 });
  }
  const treeMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(2, 2.6, 2).translate(0, 2.8, 0), basic(0xffffff), trees.length);
  const m4 = new THREE.Matrix4(), c4 = new THREE.Color();
  trees.forEach((t, i) => {
    treeMesh.setMatrixAt(i, m4.makeScale(t.s, t.s, t.s).setPosition(t.x, 0, t.z));
    treeMesh.setColorAt(i, c4.set(pick([0x16321f, 0x12291a, 0x1b3a24, 0x14301d])));  // 화면에 보이는 색(sRGB)으로 고른 어두운 초록 넷
    put(.4, 1.5 * t.s, .4, t.x, .75 * t.s, t.z, 0x1d1a16);                         // 줄기
  });
  scene.add(treeMesh);

  // ---- 4. 건물 ----
  // 창문 텍스처: 8 x 8 칸, 칸마다 창이 켜졌거나(따뜻한 색, 가끔 푸른색) 꺼졌거나
  function windowTex(warm, cool, ww, wh) {
    return canvasTex(64, 64, g => {
      g.fillStyle = '#10131c'; g.fillRect(0, 0, 64, 64);
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
        const r = rnd();
        g.fillStyle = r < warm ? (rnd() < .5 ? '#f4c46a' : '#ffe0a0') : r < warm + cool ? '#9fd0ff' : '#0a0c12';
        g.fillRect(x * 8 + (8 - ww) / 2 | 0, y * 8 + 2, ww, wh);
      }
    });
  }
  const wallsA = [], wallsB = [];  // 벽 지오메트리: A 는 빌라와 상가 (켜진 창 22%), B 는 아파트 (창이 넓고 55% 켜짐)
  // 건물 한 채: 벽의 UV 를 크기에 맞게 늘이고(창 한 칸이 cw x ch 유닛) 면마다 무작위로 밀어서 창 무늬가 달라 보이게 한 뒤, 얇은 지붕판을 얹는다.
  // 지붕 윗면 높이를 돌려준다
  function building(list, w, h, d, x, z, cw, ch, roofHex) {
    const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
    for (let f = 0; f < 6; f++) {  // 면 순서: +x, -x, +y, -y, +z, -z (면마다 꼭짓점 4개)
      const cols = Math.round((f < 2 ? d : w) / cw) / 8, rows = Math.round(h / ch) / 8;
      const ou = (rnd() * 8 | 0) / 8, ov = (rnd() * 8 | 0) / 8;
      for (let k = f * 4; k < f * 4 + 4; k++) uv.setXY(k, uv.getX(k) * cols + ou, uv.getY(k) * rows + ov);
    }
    list.push(g.translate(x, h / 2, z));
    put(w + .3, .3, d + .3, x, h + .15, z, roofHex);
    return h + .3;
  }
  // 이 자리(x, z 가 중심, w x d 크기)가 비워야 할 곳과 겹치지 않는지
  function hwDist(x, z) {  // 고속도로 중심선까지의 거리. 남쪽(강 쪽)이면 음수라서 "RW + 9 이내와 그 남쪽 전부" 가 거리 < RW + 9 하나로 검사됨
    let best = 1e12, side = 1;
    for (const s of S) {
      const d = (s.x - x) ** 2 + (s.z - z) ** 2;
      if (d < best) { best = d; side = (x - s.x) * s.nx + (z - s.z) * s.nz > 0 ? -1 : 1; }
    }
    return Math.sqrt(best) * side;
  }
  function free(x, z, w, d) {
    const x0 = x - w / 2, x1 = x + w / 2, z0 = z - d / 2, z1 = z + d / 2;
    if (x0 < RC && x1 > -RC) return false;                   // 큰길
    if (z0 < RC && z1 > -RC) return false;                   // 길 A
    if (z0 < ZB + RC && z1 > ZB - RC) return false;         // 길 B
    if (x0 < RX && x1 > -RX && z1 > RZ) return false;      // 램프 구역
    return [[x, z], [x0, z0], [x1, z0], [x0, z1], [x1, z1]].every(([px, pz]) => hwDist(px, pz) >= RW + 9);
  }

  // 대로변 상가와 오피스: 큰길 양옆 두 줄 (안쪽 줄은 |x| RW + 9 부터, 바깥 줄은 RW + 23 부터 최대 48 까지)
  const SIGN = [0xff3b3b, 0x3b8cff, 0x35e07a, 0xffd23a, 0xf2f2ff];  // 빨강 파랑 초록 노랑 흰색
  for (const sx of [-1, 1]) for (const edge of [RW + 9, RW + 23]) {
    for (let z = -170; z < 170;) {
      const w = 9 + rnd() * 4, d = 9 + rnd() * 4, x = sx * (edge + w / 2), zc = z + d / 2;
      z += d + 1 + rnd() * 2;
      if (!free(x, zc, w, d)) continue;
      let h = 10 + rnd() * 14 + Math.max(0, -zc) / 170 * 6;  // 높이 10 ~ 30, 북쪽일수록 조금 더 높게
      // 교차로에서 RW + 22 이내(건물 모서리 기준)는 12 이하로 낮춰서 교차로가 안 가려지게 함
      if ([0, ZB].some(c => Math.hypot(Math.max(Math.abs(x) - w / 2, 0), Math.max(Math.abs(zc - c) - d / 2, 0)) < RW + 22)) h = 10 + rnd() * 1.7;
      const top = building(wallsA, w, h, d, x, zc, 2.4, 3.2, 0x1c202a);
      if (edge === RW + 9 && rnd() < .5) {  // 큰길 쪽 벽에 세로 간판 (벽에서 큰길 쪽으로 튀어나온 얇은 상자)
        const sh = 3 + rnd() * 4, by = 3 + rnd() * 3;
        if (by + sh < h - .5) put(1.2, sh, .4, sx * (RW + 8.5), by + sh / 2, zc + (rnd() - .5) * (d - 3), pick(SIGN));
      }
      if (rnd() < .25) put(Math.min(w - 2, 7), 1.8, .5, x, top + .9, zc + d / 2 - .8, pick(SIGN));  // 옥상 간판 (남쪽 가장자리, 카메라 쪽)
    }
  }

  // 아파트 단지 3곳 [x0, x1, z0, z1]. 도로와는 10 씩 띄움. 3번 단지의 남쪽 끝은 고속도로 중심선에서 RW + 13 앞
  // ponytail: 3번 단지는 가장 가까운 지점 기준의 직사각형이라 고속도로가 휘는 만큼 남는 땅이 있고, 줄은 1개만 들어감
  const zMax3 = Math.min(...S.filter(s => s.x > RX && s.x < 150).map(s => s.z)) - (RW + 13);
  const complexes = [[-150, -56, ZB + RW + 10, -RW - 10], [56, 150, -150, ZB - RW - 10], [RX, 150, RZ, zMax3]];
  for (const [x0, x1, z0, z1] of complexes) {
    quad(x1 - x0, z1 - z0, (x0 + x1) / 2, .03, (z0 + z1) / 2, 0x101c16);  // 단지 바닥: 어두운 초록
    for (let z = z0 + 4.5; z + 3.5 <= z1; z += 18) {       // 남향 동을 z 방향으로 줄 간격 18 씩
      for (let x = x0 + 2; ;) {                            // 한 줄 안에서 동을 동서로 늘어놓음
        const L = 26 + rnd() * 8, h = 20 + rnd() * 14;
        if (x + L > x1 - 1) break;
        const top = building(wallsB, L, h, 7, x + L / 2, z, 1.6, 2.6, 0x1e222c);
        put(4, 2, 4, x + L * (.25 + .5 * rnd()), top + 1, z, 0x2a2e38);  // 옥상 기계실
        x += L + 5 + rnd() * 2;
      }
    }
  }

  // 주택가(빌라): 10.5 간격 격자에 크기와 위치를 조금씩 흔들어 촘촘하게. 상가 구간(|x| < RW + 37)과 아파트 단지(+2 여유)는 비움
  const villas = [];
  for (let gx = -168; gx <= 168; gx += 10.5) for (let gz = -168; gz <= 168; gz += 10.5) {

    n.st = { x: u < TX ? phase(SEQ.x, u) : 'R', z: u < TX ? 'R' : phase(SEQ.z, u - TX) };
    for (const a of ['x', 'z']) {
      LIT[n.st[a]].forEach((on, i) => n.lens[a][i].color.set(LENS[i]).multiplyScalar(on ? 1 : .05));  // 꺼진 렌즈는 같은 색을 어둡게
      n.glow[a].color.set(GLOW[n.st[a]]);
    }
  }
  for (const c of cars) {
    if (c.rp) { stepRamp(c, dt); place(c); blinker(c, t); continue; }
    const gnd = c.axis !== 'h';       // 지상 차만 신호를 보고 회전함
    let d = Infinity, cap = c.vmax;  // d: 앞을 막는 것(정지선, 앞차)까지 남은 거리 / cap: 속도 상한
    if (c.take) cap = Math.min(cap, RAMP_V + c.take.fx - c.s);  // 램프를 탈 차는 출발점에 닿기 전에 미리 감속
    if (gnd && c.turning) cap = Math.min(cap, TURN_V[c.mv]);
    else if (gnd && c.nd) {  // 앞에 교차로가 남아 있으면 그 교차로의 신호를 본다. 위치는 전부 그 교차로의 차로 좌표 c.x 기준
      const st = c.nd.st, own = c.h % 2 ? 'z' : 'x', cross = c.h % 2 ? 'x' : 'z', stop = c.x + STOP;
      // 우회전은 교차하는 축의 직진이 멈춰 있을 때, 좌회전과 직진은 자기 축 신호가 맞을 때 간다
      let go = c.mv === 'R' ? !GO.S.includes(st[cross]) : GO[c.mv].includes(st[own]);
      if (go && c.s > stop - 40 && c.s <= stop + 1.5) go = !jammed(c) && !boxBusy(c);  // 신호가 허용해도 출구가 막혔거나 가로지르는 차가 교차로에 남아 있으면 정지선에서 기다림
      // 허용 안 되면 정지선에서 섬. 선을 이미 지난 차는 그대로 가지만, 브레이크로 선 근처(1.5 안)에 설 수 있는 차(v/5 가 제동 거리)는 계속 섬
      if (!go && (c.s <= stop || c.s + c.v / 5 < stop + 1.5)) d = stop - c.s;
      if (c.mv !== 'S' && c.s < c.x - E) cap = Math.min(cap, TURN_V[c.mv] + (c.x - E - c.s));  // 회전 시작점에 닿기 전에 미리 감속
    }
    const L = c.turning ? c.dl : c.lane, sc = c.turning ? c.xd + E - c.arc + c.d : c.s;  // 회전 중이면 목적 차로 기준
    let ld = null, lg = Infinity;  // 가장 가까운 앞차와 그 간격 (차선 변경 판단용)
    for (const o of cars) if (o !== c) { const g = gapTo(o, L, sc, c.len, c); if (g < lg) { lg = g; ld = o; } d = Math.min(d, g - 6); }
    if (c.lc && c.lc.ph) for (const o of cars) if (o !== c) d = Math.min(d, gapTo(o, c.lc.to, sc, c.len, c) - 6);  // 옆으로 옮겨 가는 중이면 옮겨 갈 차로의 앞차도 봄
    const want = Math.max(0, Math.min(cap, d));  // 남은 거리가 줄수록 느리게
    c.v += Math.min((want - c.v) * Math.min(1, dt * 5), 6 * dt);  // 감속은 바로, 가속은 천천히
    if (c.turning) {  // 호를 따라 가다가, 끝에 닿으면 목적 차로에서 그 교차로의 +E 지점에 합류
      c.d += c.v * dt;
      if (c.d >= c.arc) {
        c.nd.done[c.mv]++;
        c.s = c.xd + E + c.d - c.arc; c.h = c.nh; c.lane = c.dl; c.turning = false; enter(c);
      }
    } else {
      const was = c.s, r = c.take;
      c.s += c.v * dt;
      if (r && was < r.fx && c.s >= r.fx) { c.rp = r; c.rd = c.s - r.fx; c.take = null; c.nd = null; }  // 출발점을 지나는 순간 램프로 옮겨 탐
      else if (gnd && c.nd && c.mv === 'S' && was < c.x + E && c.s >= c.x + E) { c.nd.done.S++; if (c.h % 2 === 0) c.nd.done.EW++; pick(c); }  // 직진으로 교차로를 지남
      else if (gnd && c.nd && c.mv !== 'S' && was < c.x - E && c.s >= c.x - E) { c.turning = true; c.d = c.s - (c.x - E); }  // 회전 시작점에 닿음
      if (!c.rp && c.s > c.len / 2) {  // 차로 끝: 지상 차는 가중치로 고른 차로의 처음으로, 고속도로 차는 자기 차로의 처음으로
        c.s -= c.len; c.lc = null;
        if (gnd) { const ln = reenterLane(c); c.lane = ln.id; c.h = ln.h; c.k = ln.k; c.off = ln.off; }
        enter(c);
      }
    }
    if (c.lc) {  // 차선 변경 진행: 예고(깜빡이만) > 이동(옆으로 옮겨 감) > 끝
      const l = c.lc; l.t += dt;
      if (l.ph === 0 && l.t >= LC_SIG) { if (canChange(c, l.to, 25)) { l.ph = 1; l.t = 0; } else c.lc = null; }  // 이동 시작 때 막혀 있으면 깜빡이를 끄고 취소
      else if (l.ph === 1 && l.t >= LC_MOVE) {
        const ln = laneInfo(l.to);
        c.lane = l.to; c.k = ln.k; c.off = ln.off; c.lc = null; lcDone[gnd ? 'g' : 'h']++; enter(c);
      }
    } else if (!c.turning && !c.take && c.v >= 3) tryLC(c, dt, ld, lg);
    place(c); blinker(c, t);
  }
}

// 자가 점검: 개발자 콘솔에서 check() 를 부르면 5분을 빨리 감아, 어떤 두 차도 겹치지 않는지,
// 노드마다 좌회전 직진 우회전이 모두 일어나고 동서 직진도 충분한지(위쪽 교차로는 더 많이), 램프 4개가 모두 쓰이는지, 차선 변경이 지상과 고속도로에서 일어나되 너무 잦지 않은지,
// 다리 위에 양방향으로 차가 흐르되 다리 끝까지 정체 줄이 밀리지 않는지, 오래 멈춰 선 차(교착)가 없는지 확인
window.check = () => {
  let min = Infinity, maxStill = 0, brN = 0, brS = 0, jam = 0, steps = 0;
  const still = cars.map(() => 0);  // 차마다 연속으로 멈춰 있던 시간(초)
  for (const n of nodes) n.done.L = n.done.S = n.done.R = n.done.EW = 0;
  for (const r of ramps) r.done = 0;
  lcDone.g = lcDone.h = 0;
  for (let t = 0; t < 300; t += 1 / 30) {
    step(1 / 30, t);
    for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++)
      min = Math.min(min, cars[i].g.position.distanceTo(cars[j].g.position));
    cars.forEach((c, i) => {
      still[i] = c.v < .1 ? still[i] + 1 / 30 : 0; maxStill = Math.max(maxStill, still[i]);
      const p = c.g.position;
      if (c.axis !== 'h' && !c.rp && Math.abs(p.x) < RW && p.z > 90) {  // 다리 위(큰길 z > 90)의 지상 차를 방향별로
        if (c.h === 3) brN++; else brS++;
        if (c.h === 3 && p.z > 150 && c.v < .5) jam++;                 // 다리 남쪽 끝 가까이 선 북행 차 (정체 줄이 끝까지 밀린 정도)
      }
    });
    steps++;
  }
  const bN = brN / steps, bS = brS / steps, bJam = jam / steps;
  console.assert(min > 2.2, '차가 겹침', min);
  console.assert(nodes.every(n => n.done.L > 0 && n.done.S > 0 && n.done.R > 0), '안 일어난 움직임이 있음', nodes.map(n => n.done));
  console.assert(nodes.every(n => n.done.EW >= 20), '동서 직진이 너무 적은 교차로가 있음', nodes.map(n => n.done.EW));
  console.assert(nodes[1].done.EW >= 60, '위쪽 교차로(길 B)의 동서 직진이 너무 적음', nodes[1].done.EW);
  console.assert(ramps.every(r => r.done > 0), '안 쓰인 램프가 있음', ramps.map(r => r.done));
  console.assert(lcDone.g > 0 && lcDone.h > 0, '차선 변경이 한 번도 없는 곳이 있음', lcDone);
  console.assert(lcDone.g + lcDone.h <= cars.length * 2, '차선 변경이 너무 잦음', lcDone);
  console.assert(bN >= 3 && bS >= 3, '다리 위 차가 한쪽 방향에 너무 적음', bN, bS);
  console.assert(bN + bS >= 8, '다리 위 차 합계가 너무 적음', bN + bS);
  console.assert(bJam < 1, '다리 남쪽 끝까지 북행 정체 줄이 밀림', bJam);
  console.assert(maxStill < 90, '오래 멈춘 차가 있음 (교착?)', maxStill);
  return `최소 거리 ${min.toFixed(2)}, ` + nodes.map((n, i) => `노드${i} 좌 ${n.done.L} 직 ${n.done.S}(동서 ${n.done.EW}) 우 ${n.done.R}`).join(', ') + `, 램프 ` + ramps.map((r, i) => `R${i + 1} ${r.done}`).join(' ') +
    `, 차선 변경 지상 ${lcDone.g} 고속 ${lcDone.h}, 다리 위 평균 북행 ${bN.toFixed(1)} 남행 ${bS.toFixed(1)}, 남쪽 끝 정체 ${bJam.toFixed(2)}대, 최장 정지 ${maxStill.toFixed(1)}초`;
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  step(dt, clock.elapsedTime);
  sceneryUpdate(dt, clock.elapsedTime);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</html>
